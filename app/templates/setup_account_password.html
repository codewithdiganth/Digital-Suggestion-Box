{% extends "base.html" %}

{% block title %}Set Account Password{% endblock %}

{% block content %}
<section class="form-container">
    <h1>Set Your Password</h1>
    <p>Choose a password with at least 8 characters. This one-time link expires after 24 hours.</p>

    <form method="POST" action="{{ request.path }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="new_password">New Password</label>
        <input
            type="password"
            id="new_password"
            name="new_password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <label for="confirm_password">Confirm New Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <button type="submit">Set Password</button>
    </form>
</section>
{% endblock %}
