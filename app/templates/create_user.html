
{% extends "base.html" %}

{% block title %}Create User{% endblock %}

{% block content %}

<section class="form-container">

    <h2>Create User</h2>

    <p>Create a citizen account. The user will receive a one-time email link to choose a password.</p>

    <form method="POST" action="{{ url_for('create_user') }}">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="full_name">Full Name</label>
        <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Enter full name"
            maxlength="100"
            required
            autocomplete="name"
        >

        <label for="mobile_number">Mobile Number</label>
        <input
            type="tel"
            id="mobile_number"
            name="mobile_number"
            placeholder="+15551234567"
            pattern="\+?[1-9][0-9\s().-]{5,24}"
            maxlength="30"
            required
            autocomplete="tel"
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            placeholder="name@example.com"
            required
            autocomplete="email"
        >

        <button type="submit">Create User</button>

    </form>

    <p>
        <a href="{{ url_for('manage_users') }}">Back to Manage Users</a>
    </p>

</section>

{% endblock %}
