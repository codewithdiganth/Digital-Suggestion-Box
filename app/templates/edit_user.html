{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}
<section class="form-container">
    <h1>Edit User</h1>
    <p>User ID: <strong>{{ user.public_user_id or user.username }}</strong></p>

    <form method="POST" action="{{ url_for('edit_user', user_id=user.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="full_name">Full Name</label>
        <input
            type="text"
            id="full_name"
            name="full_name"
            maxlength="100"
            autocomplete="name"
            value="{{ user.full_name or '' }}"
            required
        >

        <label for="mobile_number">Mobile Number</label>
        <input
            type="tel"
            id="mobile_number"
            name="mobile_number"
            maxlength="30"
            pattern="\+?[1-9][0-9\s().-]{5,24}"
            autocomplete="tel"
            value="{{ user.mobile_number or '' }}"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            value="{{ user.email or '' }}"
            required
        >

        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="citizen" {% if user.role == "citizen" %}selected{% endif %}>Citizen</option>
            <option value="staff" {% if user.role == "staff" %}selected{% endif %}>Staff</option>
            <option value="admin" {% if user.role == "admin" %}selected{% endif %}>Admin</option>
        </select>

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('manage_users') }}">Back to Manage Users</a></p>
</section>
{% endblock %}
